<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="A crooked, misprinted sticker illustrating a page that could not be found">
  <rect width="320" height="320" fill="#f6f5f2"/>
  <g transform="rotate(-8 160 160)">
    <rect x="70" y="90" width="180" height="140" rx="16" fill="#ffffff" stroke="#e6e4df" stroke-width="2"/>
    <rect x="70" y="90" width="180" height="140" rx="16" fill="none" stroke="#ff4b3e" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="160" y="175" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#ff4b3e" text-anchor="middle">404</text>
    <text x="160" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#62626b" text-anchor="middle" letter-spacing="1">MISPRINT</text>
  </g>
  <circle cx="245" cy="95" r="14" fill="#ffc93c"/>
  <circle cx="70" cy="235" r="10" fill="#00aeef"/>
</svg>
