<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Illustration representing a finishes guide: matte, gloss and soft-touch label swatches side by side">
  <rect width="400" height="280" fill="#fff5da"/>
  <rect x="60" y="90" width="90" height="100" rx="10" fill="#14151a"/>
  <text x="105" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">MATTE</text>
  <rect x="170" y="90" width="90" height="100" rx="10" fill="#ec0868"/>
  <ellipse cx="200" cy="120" rx="40" ry="14" fill="#ffffff" opacity="0.3"/>
  <text x="215" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">GLOSS</text>
  <rect x="280" y="90" width="90" height="100" rx="10" fill="#ff4b3e"/>
  <text x="325" y="210" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#8a5a00" text-anchor="middle">SOFT-TOUCH</text>
</svg>
