<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Close-up swatch of clear transparent label film showing a checkerboard to illustrate see-through areas">
  <defs>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f6f5f2"/>
      <rect width="12" height="12" fill="#e6e4df"/>
      <rect x="12" y="12" width="12" height="12" fill="#e6e4df"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#checker)"/>
  <rect x="60" y="60" width="280" height="180" rx="14" fill="#ffffff" fill-opacity="0.25" stroke="#00aeef" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="200" cy="150" r="46" fill="#ffffff" fill-opacity="0.35" stroke="#00aeef" stroke-width="2"/>
</svg>
